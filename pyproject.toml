[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "gwflow"
version = "0.9.0"
description = "Composable tasks, container execution, and managed storage for gwf workflows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE"}
dependencies = ["gwf==2.1.1", "rich>=15.0.0,<16", "textual>=8.2.8,<9"]

[project.scripts]
gwflow = "gwflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
