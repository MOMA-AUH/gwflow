[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gwflow"
version = "0.1.0"
description = "Task definitions for gwf workflows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE"}
dependencies = ["gwf==2.1.1"]

[tool.setuptools.packages.find]
where = ["src"]
