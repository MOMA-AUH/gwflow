name: Publish Conda release

on:
  workflow_run:
    workflows: ["Release qualification"]
    types: [completed]

permissions:
  contents: read
  actions: read

# Never cancel a publication in progress or run two publications for one tag.
concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.ci.outputs.run_id }}
      source: ${{ steps.identity.outputs.source }}
      tag: ${{ steps.identity.outputs.tag }}
      artifact_id: ${{ steps.ci.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check trusted completed qualification, exact tag, and master source
        id: identity
        run: |
          python tests/qualification_event.py publish \
            --event "$GITHUB_EVENT_PATH" --repo "$GITHUB_REPOSITORY" --output "$GITHUB_OUTPUT"
      - name: Select the triggering successful qualification for the exact tagged commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ steps.identity.outputs.source }}
          RUN_ID: ${{ steps.identity.outputs.run_id }}
        run: |
          python tests/select_ci_release.py --repo "$GITHUB_REPOSITORY" \
            --source "$SOURCE" --run-id "$RUN_ID" --output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.ci.outputs.artifact_id }}
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}
          path: conda-dist
      - name: Verify the tested package, source, version, and qualification
        env:
          SOURCE: ${{ steps.identity.outputs.source }}
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          python tests/release_artifacts.py verify \
            --bundle conda-dist --tag "$TAG" --source "$SOURCE"

  publish:
    needs: verify
    env:
      SOURCE: ${{ needs.verify.outputs.source }}
      TAG: ${{ needs.verify.outputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.source }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          run-id: ${{ needs.verify.outputs.run_id }}
          github-token: ${{ github.token }}
          path: conda-dist
      - name: Verify downloaded artifact and qualification identities
        run: |
          python tests/release_artifacts.py verify \
            --bundle conda-dist --tag "$TAG" --source "$SOURCE"
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          channels: conda-forge
          conda-remove-defaults: "true"
      - name: Install Anaconda.org client
        shell: bash -l {0}
        run: conda install -y -n base anaconda-client -c conda-forge
      - name: Publish or resume the verified package and draft
        shell: bash -l {0}
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python tests/publish_release.py \
            --bundle conda-dist --tag "$TAG" --source "$SOURCE" \
            --repo "$GITHUB_REPOSITORY" --source-ci-run "${{ needs.verify.outputs.run_id }}" \
            --output release-evidence
      - uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: gwflow-publication-evidence
          path: |
            release-evidence/assets/*
            release-evidence/publication-attempt.json
          if-no-files-found: error
