name: Publish Conda release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  actions: read

# Never cancel a publication in progress or run two publications for one tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.ci.outputs.run_id }}
      artifact_id: ${{ steps.ci.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check release tag and branch
        shell: bash
        run: |
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "v$version"
          grep -Fqx "{% set version = \"$version\" %}" conda-recipe/meta.yaml
      - name: Select successful master CI for the exact tagged commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tests/select_ci_release.py --repo "$GITHUB_REPOSITORY" \
            --source "$GITHUB_SHA" --output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.ci.outputs.artifact_id }}
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}
          path: conda-dist
      - name: Verify the tested package, source, version, and qualification
        run: |
          python tests/release_artifacts.py verify \
            --bundle conda-dist --tag "$GITHUB_REF_NAME" --source "$GITHUB_SHA"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          run-id: ${{ needs.verify.outputs.run_id }}
          github-token: ${{ github.token }}
          path: conda-dist
      - name: Verify downloaded artifact and qualification identities
        run: |
          python tests/release_artifacts.py verify \
            --bundle conda-dist --tag "$GITHUB_REF_NAME" --source "$GITHUB_SHA"
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          channels: conda-forge
          conda-remove-defaults: "true"
      - name: Install Anaconda.org client
        shell: bash -l {0}
        run: conda install -y -n base anaconda-client -c conda-forge
      - name: Upload to MOMA-AUH
        shell: bash -l {0}
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          test -n "$ANACONDA_API_TOKEN" || { echo 'ANACONDA_API_TOKEN secret is required' >&2; exit 1; }
          conda run -n base anaconda upload --user MOMA-AUH --register --label main --no-progress conda-dist/gwflow-*.conda
      - name: Install published package and verify reuse
        shell: bash -l {0}
        run: |
          version=${GITHUB_REF_NAME#v}
          for attempt in {1..10}; do
            if conda create -y -p "$RUNNER_TEMP/gwflow-published-test" python=3.12 "gwflow=$version" --override-channels -c MOMA-AUH -c gwforg -c conda-forge; then
              break
            fi
            if (( attempt == 10 )); then
              echo 'Published package was not installable after 10 attempts' >&2
              exit 1
            fi
            sleep 30
          done
          conda list -p "$RUNNER_TEMP/gwflow-published-test" --json | python -c 'import json, sys; package = next(p for p in json.load(sys.stdin) if p["name"] == "gwflow"); assert package["base_url"].rstrip("/").casefold().endswith("/moma-auh"), package'
          conda run -p "$RUNNER_TEMP/gwflow-published-test" python -m pip install ./examples/packaged/packages/summary-task ./examples/packaged/packages/report-task
          conda run -p "$RUNNER_TEMP/gwflow-published-test" python tests/release_smoke.py
      - name: Verify and record published artifact provenance
        shell: bash -l {0}
        run: |
          conda run -p "$RUNNER_TEMP/gwflow-published-test" python tests/release_provenance.py \
            --artifacts conda-dist --source "$GITHUB_SHA" --tag "$GITHUB_REF_NAME" \
            --output conda-dist/publication.json
      - name: Package validation records for release
        run: |
          python tests/release_artifacts.py pack \
            --bundle conda-dist --publication conda-dist/publication.json \
            --tag "$GITHUB_REF_NAME" --source "$GITHUB_SHA" --output release-assets
      - name: Preserve attachments in the GitHub release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tests/release_artifacts.py attach \
            --bundle release-assets \
            --tag "$GITHUB_REF_NAME" --source "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: gwflow-publication-evidence
          path: release-assets/*
          if-no-files-found: error
