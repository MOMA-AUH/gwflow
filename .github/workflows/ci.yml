name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qualification:
    uses: ./.github/workflows/qualification.yml
    with:
      source: ${{ github.sha }}

  # Preserve the existing required check names across reusable-workflow jobs.
  tests:
    if: always()
    needs: qualification
    runs-on: ubuntu-24.04
    steps:
      - name: Require full qualification
        env:
          RESULT: ${{ needs.qualification.result }}
        run: test "$RESULT" = success

  conda:
    if: always()
    needs: qualification
    runs-on: ubuntu-24.04
    steps:
      - name: Require full qualification
        env:
          RESULT: ${{ needs.qualification.result }}
        run: test "$RESULT" = success
