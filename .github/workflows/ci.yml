name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      shard-count:
        description: Installed-suite shards for a same-source qualification comparison
        type: choice
        options: ["2", "4"]
        default: "4"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classification:
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.changes.outputs.mode }}
      release-simulations: ${{ steps.changes.outputs.release_simulations }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Both PR parents and their merge base are needed for the complete diff.
          fetch-depth: 0
      - name: Classify the complete pull request diff
        id: changes
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "release_simulations=run" >> "$GITHUB_OUTPUT"
          else
            python3 tests/ci_changes.py classify --base "$PR_BASE" --head "$PR_HEAD" \
              --github-output "$GITHUB_OUTPUT"
          fi

  documentation:
    needs: classification
    if: needs.classification.outputs.mode == 'docs'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check prose diff formatting
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$PR_BASE...$PR_HEAD"
      - name: Check recommended README installation
        run: python3 -m unittest discover -s tests -p test_readme.py -v
      - name: Check change classification and required result handling
        run: python3 -m unittest discover -s tests -p test_ci_changes.py -v

  qualification:
    needs: classification
    if: needs.classification.outputs.mode == 'full'
    uses: ./.github/workflows/qualification.yml
    with:
      source: ${{ github.sha }}
      shard-count: ${{ fromJSON(inputs.shard-count || '4') }}
      release-simulations: ${{ needs.classification.outputs.release-simulations }}

  # Preserve the required names and explicitly verify selected and unselected jobs.
  tests:
    if: always()
    needs: [classification, documentation, qualification]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Require every selected validation to pass
        env:
          MODE: ${{ needs.classification.outputs.mode }}
          RESULTS: ${{ toJSON(needs) }}
        run: python3 tests/ci_changes.py gate --mode "$MODE" --needs "$RESULTS"

  conda:
    if: always()
    needs: [classification, documentation, qualification]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Require every selected validation to pass
        env:
          MODE: ${{ needs.classification.outputs.mode }}
          RESULTS: ${{ toJSON(needs) }}
        run: python3 tests/ci_changes.py gate --mode "$MODE" --needs "$RESULTS"
