name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
      - name: Install gwf and gwflow
        shell: bash -l {0}
        run: |
          conda create -y -n gwflow-tests python=3.12 pip gwf=2.1.1 -c gwforg -c conda-forge
          conda run -n gwflow-tests python -m pip install .
          conda run -n gwflow-tests python -m pip install ./examples/packaged/packages/summary-task ./examples/packaged/packages/report-task
      - name: Run installed-package and local-backend tests
        shell: bash -l {0}
        run: conda run -n gwflow-tests python -m unittest discover -s tests -v

  conda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
      - name: Install conda-build
        shell: bash -l {0}
        run: conda install -y -n base conda-build -c conda-forge
      - name: Build artifact
        shell: bash -l {0}
        run: conda build conda-recipe --no-anaconda-upload -c gwforg -c conda-forge --output-folder "$RUNNER_TEMP/conda-dist"
      - name: Install artifact and run local backend tests
        shell: bash -l {0}
        run: |
          version=$(awk -F '"' '/set version/ {print $2}' conda-recipe/meta.yaml)
          test -n "$version"
          artifact=$(find "$RUNNER_TEMP/conda-dist" -name "gwflow-${version}-*.conda" -print -quit)
          test -n "$artifact"
          conda create -y -p "$RUNNER_TEMP/gwflow-smoke" python=3.12 "gwflow=$version" -c "file://$RUNNER_TEMP/conda-dist" -c gwforg -c conda-forge
          conda run -p "$RUNNER_TEMP/gwflow-smoke" python -m pip install ./examples/packaged/packages/summary-task ./examples/packaged/packages/report-task
          conda list -p "$RUNNER_TEMP/gwflow-smoke" --json | python -c 'import json, sys; package = next(p for p in json.load(sys.stdin) if p["name"] == "gwflow"); assert package["base_url"].startswith("file://"), package'
          conda run -p "$RUNNER_TEMP/gwflow-smoke" python -m unittest discover -s tests -v
          conda run -p "$RUNNER_TEMP/gwflow-smoke" python tests/release_smoke.py
