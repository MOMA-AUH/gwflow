name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v

  conda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          conda-build-version: latest
      - name: Build artifact
        shell: bash -l {0}
        run: conda build conda-recipe -c gwforg -c conda-forge --output-folder "$RUNNER_TEMP/conda-dist"
      - name: Install artifact and run local backend tests
        shell: bash -l {0}
        run: |
          artifact=$(find "$RUNNER_TEMP/conda-dist" -name 'gwflow-0.1.0-*.conda' -print -quit)
          test -n "$artifact"
          conda create -y -p "$RUNNER_TEMP/gwflow-smoke" python=3.12 "$artifact" -c gwforg -c conda-forge
          conda run -p "$RUNNER_TEMP/gwflow-smoke" python -m unittest discover -s tests -v
