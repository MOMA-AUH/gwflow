name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    # The pinned Apptainer .deb requires libraries unavailable on Ubuntu 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          channels: conda-forge
          conda-remove-defaults: "true"
      - name: Install gwf and gwflow
        shell: bash -l {0}
        run: |
          conda create -y -n gwflow-tests python=3.12 pip gwf=2.1.1 -c gwforg -c conda-forge
          conda run -n gwflow-tests python -m pip install .
          conda run -n gwflow-tests python -m pip install ./examples/packaged/packages/summary-task ./examples/packaged/packages/report-task
      - name: Verify installed Task compatibility
        shell: bash -l {0}
        run: |
          baseline_source=$(python -c 'import json; print(json.load(open("docs/validation/compatibility/baseline.json"))["source"]["commit"])')
          git fetch --no-tags --depth=1 origin "$baseline_source"
          mkdir -p build/validation/compatibility-baseline/source build/validation/compatibility-baseline/wheels
          git archive "$baseline_source" | tar -x -C build/validation/compatibility-baseline/source
          conda run -n gwflow-tests python -m pip wheel --no-deps --wheel-dir build/validation/compatibility-baseline/wheels build/validation/compatibility-baseline/source
          conda run -n gwflow-tests python -m venv --system-site-packages build/validation/compatibility-baseline/environment
          build/validation/compatibility-baseline/environment/bin/python -m pip install --no-deps --ignore-installed build/validation/compatibility-baseline/wheels/*.whl
          candidate_python=$(conda run -n gwflow-tests python -c 'import sys; print(sys.executable)')
          conda run -n gwflow-tests python tests/validate_compatibility.py \
            --baseline-python "$PWD/build/validation/compatibility-baseline/environment/bin/python" \
            --candidate-python "$candidate_python" \
            --baseline-source "$baseline_source" --candidate-source "$(git rev-parse HEAD)" \
            --root build/validation/compatibility
          cat build/validation/compatibility/environment.json build/validation/compatibility/summary.json
      - name: Prepare real Apptainer container tests
        run: |
          curl -fsSL -o "$RUNNER_TEMP/apptainer.deb" https://github.com/apptainer/apptainer/releases/download/v1.5.4/apptainer_1.5.4_amd64.deb
          sudo apt-get update
          sudo apt-get install -y "$RUNNER_TEMP/apptainer.deb"
          apptainer --version
          apptainer build "$RUNNER_TEMP/gwflow-test.sif" tests/fixtures/container.def
          echo "GWFLOW_TEST_SIF=$RUNNER_TEMP/gwflow-test.sif" >> "$GITHUB_ENV"
          apptainer build "$RUNNER_TEMP/summary.sif" examples/packaged/images/summary.def
          apptainer build "$RUNNER_TEMP/report.sif" examples/packaged/images/report.def
          echo "GWFLOW_TEST_SUMMARY_SIF=$RUNNER_TEMP/summary.sif" >> "$GITHUB_ENV"
          echo "GWFLOW_TEST_REPORT_SIF=$RUNNER_TEMP/report.sif" >> "$GITHUB_ENV"
      - name: Run installed-package and local-backend tests
        shell: bash -l {0}
        run: |
          conda run -n gwflow-tests python -m unittest discover -s tests -v
          conda run -n gwflow-tests python tests/release_smoke.py
          conda run -n gwflow-tests python tests/validate_containers.py --backend local --root "$RUNNER_TEMP/container-acceptance"
      - uses: actions/upload-artifact@v7
        with:
          name: installed-source-evidence
          path: |
            build/validation/compatibility/environment.json
            build/validation/compatibility/summary.json
            ${{ runner.temp }}/container-acceptance/environment.json
            ${{ runner.temp }}/container-acceptance/summary.json
          if-no-files-found: error

  conda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          channels: conda-forge
          conda-remove-defaults: "true"
      - name: Install conda-build
        shell: bash -l {0}
        run: conda install -y -n base conda-build -c conda-forge
      - name: Build artifact
        shell: bash -l {0}
        run: conda build conda-recipe --no-anaconda-upload -c gwforg -c conda-forge --output-folder "$RUNNER_TEMP/conda-dist"
      - name: Install artifact and run local backend tests
        shell: bash -l {0}
        run: |
          version=$(awk -F '"' '/set version/ {print $2}' conda-recipe/meta.yaml)
          test -n "$version"
          artifact=$(find "$RUNNER_TEMP/conda-dist" -name "gwflow-${version}-*.conda" -print -quit)
          test -n "$artifact"
          conda create -y -p "$RUNNER_TEMP/gwflow-smoke" python=3.12 "gwflow=$version" -c "file://$RUNNER_TEMP/conda-dist" -c gwforg -c conda-forge
          conda run -p "$RUNNER_TEMP/gwflow-smoke" python -m pip install ./examples/packaged/packages/summary-task ./examples/packaged/packages/report-task
          conda list -p "$RUNNER_TEMP/gwflow-smoke" --json | python -c 'import json, sys; package = next(p for p in json.load(sys.stdin) if p["name"] == "gwflow"); assert package["base_url"].startswith("file://"), package'
          conda run -p "$RUNNER_TEMP/gwflow-smoke" python -m unittest discover -s tests -v
          conda run -p "$RUNNER_TEMP/gwflow-smoke" python tests/release_smoke.py
      - name: Capture and qualify the tested Conda runtime
        shell: bash -l {0}
        run: |
          artifact=$(find "$RUNNER_TEMP/conda-dist/noarch" -name 'gwflow-*.conda' -print -quit)
          test -n "$artifact"
          python tests/conda_runtime.py capture \
            --prefix "$RUNNER_TEMP/gwflow-smoke" --artifact "$artifact" \
            --source "$PWD" --output "$RUNNER_TEMP/conda-runtime"
          python tests/validate_conda_runtime.py \
            --capture "$RUNNER_TEMP/conda-runtime" --source "$PWD" \
            --root build/validation/conda-runtime
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          source=$(git rev-parse HEAD)
          python tests/release_artifacts.py prepare \
            --capture "$RUNNER_TEMP/conda-runtime" \
            --qualification build/validation/conda-runtime/restored/gwflow-runtime.json \
            --tag "v$version" --source "$source" --output "$RUNNER_TEMP/qualified-release"
          python tests/release_artifacts.py verify \
            --bundle "$RUNNER_TEMP/qualified-release" --tag "v$version" --source "$source"
      - name: Compare independent controlled runtimes
        shell: bash -l {0}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          artifact=$(find "$RUNNER_TEMP/conda-dist/noarch" -name "gwflow-${version}-*.conda" -print -quit)
          test -n "$artifact"
          source=$(git rev-parse HEAD)
          # A supported older Python patch exercises runtime variation in this fixture.
          # Both installations use the candidate artifact, not a published stable baseline.
          conda create -y -p "$RUNNER_TEMP/gwflow-compat-candidate" python=3.12.14 "gwflow=$version" -c "file://$RUNNER_TEMP/conda-dist" -c gwforg -c conda-forge
          conda run -p "$RUNNER_TEMP/gwflow-smoke" python tests/compare_runtime.py \
            --baseline-capture "$RUNNER_TEMP/conda-runtime" --baseline-kind controlled-artifact \
            --candidate-python "$RUNNER_TEMP/gwflow-compat-candidate/bin/python" \
            --candidate-artifact "$artifact" --candidate-source "$source" \
            --root build/validation/independent-compatibility
          python - <<'PY'
          import json
          from pathlib import Path
          evidence = json.loads(Path("build/validation/independent-compatibility/comparison.json").read_text())
          assert evidence["status"] == "passed", evidence
          assert evidence["baseline_kind"] == "controlled-artifact", evidence
          assert evidence["exact_baseline_runtime"] is True, evidence
          baseline = evidence["environments"]["baseline"]
          candidate = evidence["environments"]["candidate"]
          assert baseline["prefix"] == "<BASELINE>" and candidate["prefix"] == "<CANDIDATE>", evidence
          assert baseline["prefix_identity"] != candidate["prefix_identity"], evidence
          assert baseline["python_version"] != candidate["python_version"], (baseline, candidate)
          assert candidate["python_version"] == "3.12.14", candidate
          for environment in (baseline, candidate):
              assert environment["dependency_policy"] == "independent", environment
              assert environment["supported_runtime"] is True, environment
          assert evidence["journeys"] == {"run": 15, "failures": 0, "errors": 0, "skips": 0}, evidence
          PY
          python tests/conda_runtime.py capture \
            --prefix "$RUNNER_TEMP/gwflow-compat-candidate" --artifact "$artifact" \
            --source "$PWD" --output "$RUNNER_TEMP/compat-replacement"
          conda run -p "$RUNNER_TEMP/gwflow-smoke" python tests/compare_runtime.py \
            --baseline-capture "$RUNNER_TEMP/conda-runtime" --baseline-kind controlled-artifact \
            --replacement-capture "$RUNNER_TEMP/compat-replacement" \
            --replacement-reason 'Controlled dependency-loss replacement fixture; not an exact original runtime' \
            --candidate-python "$RUNNER_TEMP/gwflow-compat-candidate/bin/python" \
            --candidate-artifact "$artifact" --candidate-source "$source" \
            --root build/validation/replacement-compatibility
          python - <<'PY'
          import json
          from pathlib import Path
          evidence = json.loads(Path("build/validation/replacement-compatibility/comparison.json").read_text())
          assert evidence["status"] == "passed", evidence
          assert evidence["baseline_kind"] == "controlled-artifact", evidence
          assert evidence["exact_baseline_runtime"] is False, evidence
          assert evidence["replacement"]["reason"], evidence
          assert evidence["baseline_capture"]["artifact"] == evidence["replacement"]["capture"]["artifact"], evidence
          for environment in evidence["environments"].values():
              assert environment["dependency_policy"] == "independent", environment
              assert environment["supported_runtime"] is True, environment
          assert evidence["journeys"] == {"run": 15, "failures": 0, "errors": 0, "skips": 0}, evidence
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: conda-runtime-evidence
          path: |
            ${{ runner.temp }}/conda-runtime/runtime.explicit.txt
            ${{ runner.temp }}/conda-runtime/runtime.json
            build/validation/conda-runtime/summary.json
            build/validation/independent-compatibility/comparison.json
            build/validation/replacement-compatibility/comparison.json
            ${{ runner.temp }}/qualified-release/release.json
            ${{ runner.temp }}/qualified-release/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: gwflow-conda-candidate
          path: ${{ runner.temp }}/conda-dist/noarch/gwflow-*.conda
          if-no-files-found: error
