name: Full qualification

on:
  workflow_call:
    inputs:
      source:
        required: true
        type: string
      release-simulations:
        description: Run or skip extra release plumbing checks; only ordinary PRs may skip
        type: string
        default: run

permissions:
  contents: read

jobs:
  tests:
    # The pinned Apptainer .deb requires libraries unavailable on Ubuntu 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source }}
      - name: Check recommended README installation
        run: python3 -m unittest discover -s tests -p test_readme.py -v
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          channels: conda-forge
          conda-remove-defaults: "true"
      - uses: ./.github/actions/cache-conda-downloads
        with:
          profile: source
      - name: Install gwf and gwflow
        shell: bash -l {0}
        run: bash tests/prepare_ci_conda.sh source
      - name: Select checkout-pinned compatibility baselines
        id: compatibility
        shell: bash -l {0}
        run: |
          conda run -n gwflow-tests python tests/select_compatibility.py plan \
            --descriptor docs/validation/compatibility/baseline.json \
            --output build/validation/compatibility-plan.json
          mode=$(python -c 'import json; print(json.load(open("build/validation/compatibility-plan.json"))["mode"])')
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Verify provisional installed Task compatibility
        if: steps.compatibility.outputs.mode == 'provisional-source'
        shell: bash -l {0}
        run: |
          baseline_source=$(python -c 'import json; print(json.load(open("docs/validation/compatibility/baseline.json"))["source"]["commit"])')
          git fetch --no-tags --depth=1 origin "$baseline_source"
          mkdir -p build/validation/compatibility-baseline/source build/validation/compatibility-baseline/wheels
          git archive "$baseline_source" | tar -x -C build/validation/compatibility-baseline/source
          conda run -n gwflow-tests python -m pip wheel --no-deps --wheel-dir build/validation/compatibility-baseline/wheels build/validation/compatibility-baseline/source
          conda run -n gwflow-tests python -m venv --system-site-packages build/validation/compatibility-baseline/environment
          build/validation/compatibility-baseline/environment/bin/python -m pip install --no-deps --ignore-installed build/validation/compatibility-baseline/wheels/*.whl
          candidate_python=$(conda run -n gwflow-tests python -c 'import sys; print(sys.executable)')
          conda run -n gwflow-tests python tests/validate_compatibility.py \
            --baseline-python "$PWD/build/validation/compatibility-baseline/environment/bin/python" \
            --candidate-python "$candidate_python" \
            --baseline-source "$baseline_source" --candidate-source "$(git rev-parse HEAD)" \
            --root build/validation/compatibility
          cat build/validation/compatibility/environment.json build/validation/compatibility/summary.json
      - name: Check pip installation and representative behavior
        shell: bash -l {0}
        run: |
          conda run -n gwflow-tests python -m pip check
          conda run -n gwflow-tests python -I -c 'import gwflow, gwflow.browser, gwflow.cli'
          conda run -n gwflow-tests python -m unittest discover -s tests -p test_cli.py -v
          conda run -n gwflow-tests python -m unittest discover -s tests -p test_browser_interaction.py -k test_normal_compact_and_large_views_survive_resize_without_reinspection -v
          conda run -n gwflow-tests python tests/release_smoke.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          overwrite: true
          name: installed-source-evidence
          path: |
            build/validation/compatibility-plan.json
            build/validation/compatibility/environment.json
            build/validation/compatibility/summary.json
            build/validation/compatibility/status-consumer.json
          if-no-files-found: error

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source }}
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          channels: conda-forge
          conda-remove-defaults: "true"
      - uses: ./.github/actions/cache-conda-downloads
        with:
          profile: build
      - name: Build and install the candidate once
        shell: bash -l {0}
        run: bash tests/prepare_ci_conda.sh build
      - uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: gwflow-ci-runtime
          retention-days: 3
          path: ${{ runner.temp }}/ci-runtime/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: gwflow-ci-channel
          retention-days: 3
          path: ${{ runner.temp }}/conda-dist/**
          if-no-files-found: error

  prepare-fixtures:
    uses: ./.github/workflows/fixture-cache.yml
    with:
      source: ${{ inputs.source }}

  conda-suite:
    name: Conda tests
    needs: [build, prepare-fixtures]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source }}
      - uses: ./.github/actions/restore-ci-runtime
        with:
          containers: "true"
      - name: Run the full installed Conda suite
        shell: bash -l {0}
        run: |
          conda create -y -p "$RUNNER_TEMP/spring" --override-channels -c conda-forge -c bioconda spring=1.1.1
          export PATH="$RUNNER_TEMP/spring/bin:$PATH"
          conda run -p "$RUNNER_TEMP/gwflow-smoke" python tests/ci_suite.py run \
            --bundle "$RUNNER_TEMP/ci-runtime" --prefix "$RUNNER_TEMP/gwflow-smoke" \
            --output build/validation/ci-suite/suite.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          overwrite: true
          name: conda-suite
          path: build/validation/ci-suite/suite.json
          if-no-files-found: warn

  containers:
    needs: [build, prepare-fixtures]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source }}
      - uses: ./.github/actions/restore-ci-runtime
        with:
          containers: "true"
      - name: Run consolidated container acceptance against the Conda package
        shell: bash -l {0}
        run: |
          conda run -p "$RUNNER_TEMP/gwflow-smoke" python tests/validate_containers.py \
            --backend local --root "$RUNNER_TEMP/container-acceptance"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          overwrite: true
          name: container-acceptance-evidence
          path: |
            ${{ runner.temp }}/container-acceptance/environment.json
            ${{ runner.temp }}/container-acceptance/summary.json
          if-no-files-found: warn

  conda:
    # Keep the existing required check. It cannot pass if a prerequisite fails.
    if: always()
    needs: [build, prepare-fixtures, conda-suite, containers]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every Conda prerequisite to pass
        env:
          PREREQUISITE_RESULTS: ${{ toJSON(needs) }}
        run: |
          python -c 'import json, os; results = json.loads(os.environ["PREREQUISITE_RESULTS"]); assert all(job["result"] == "success" for job in results.values()), results'
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source }}
      - name: Select release-process simulation coverage
        id: simulations
        shell: bash
        env:
          SIMULATION_SELECTION: ${{ inputs.release-simulations }}
        run: |
          mkdir -p build/validation
          python3 tests/ci_changes.py simulation-plan --event "$GITHUB_EVENT_NAME" \
            --selection "$SIMULATION_SELECTION" --github-output "$GITHUB_OUTPUT" \
            | tee build/validation/simulation-plan.json
      - uses: ./.github/actions/restore-ci-runtime
      - uses: actions/download-artifact@v8
        with:
          name: conda-suite
          path: build/validation/ci-suite
      - name: Verify complete suite coverage in the exact runtime
        shell: bash -l {0}
        run: |
          conda run -p "$RUNNER_TEMP/gwflow-smoke" python tests/ci_suite.py verify \
            --bundle "$RUNNER_TEMP/ci-runtime" --prefix "$RUNNER_TEMP/gwflow-smoke" \
            --record build/validation/ci-suite/suite.json
          conda run -p "$RUNNER_TEMP/gwflow-smoke" python tests/release_smoke.py
      - name: Select checkout-pinned compatibility baselines
        id: compatibility
        shell: bash -l {0}
        run: |
          python tests/select_compatibility.py plan \
            --descriptor docs/validation/compatibility/baseline.json \
            --output build/validation/compatibility-plan.json
          mode=$(python -c 'import json; print(json.load(open("build/validation/compatibility-plan.json"))["mode"])')
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Capture and qualify the tested Conda runtime
        id: capture
        if: steps.simulations.outputs.run == 'true'
        shell: bash -l {0}
        run: |
          artifact=$(find "$RUNNER_TEMP/ci-runtime" -name 'gwflow-*.conda' -print -quit)
          test -n "$artifact"
          python tests/conda_runtime.py capture \
            --prefix "$RUNNER_TEMP/gwflow-smoke" --artifact "$artifact" \
            --source "$PWD" --output "$RUNNER_TEMP/conda-runtime"
          python tests/validate_conda_runtime.py \
            --capture "$RUNNER_TEMP/conda-runtime" --source "$PWD" \
            --root build/validation/conda-runtime
      - uses: actions/download-artifact@v8
        if: steps.simulations.outputs.run == 'true' || steps.compatibility.outputs.mode == 'preserved-release'
        with:
          name: gwflow-ci-channel
          path: ${{ runner.temp }}/conda-dist
      - name: Compare independent controlled runtimes
        id: controlled
        if: steps.simulations.outputs.run == 'true'
        shell: bash -l {0}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          artifact=$(find "$RUNNER_TEMP/ci-runtime" -name "gwflow-${version}-*.conda" -print -quit)
          test -n "$artifact"
          source=$(git rev-parse HEAD)
          # A supported older Python patch exercises runtime variation in this fixture.
          # Both installations use the candidate artifact, not a published stable baseline.
          conda create -y -p "$RUNNER_TEMP/gwflow-compat-candidate" python=3.12.14 "gwflow=$version" -c "file://$RUNNER_TEMP/conda-dist" -c gwforg -c conda-forge
          python tests/conda_runtime.py capture \
            --prefix "$RUNNER_TEMP/gwflow-compat-candidate" --artifact "$artifact" \
            --source "$PWD" --output "$RUNNER_TEMP/compat-replacement"
          for fixture_profile in without-examples with-examples; do
            if [ "$fixture_profile" = with-examples ]; then
              conda run -p "$RUNNER_TEMP/gwflow-compat-candidate" python -m pip install --no-deps \
                ./tests/fixtures/packaged_tasks/packages/summary-task ./tests/fixtures/packaged_tasks/packages/report-task
            fi
            conda run -p "$RUNNER_TEMP/gwflow-smoke" python tests/compare_runtime.py \
              --baseline-capture "$RUNNER_TEMP/conda-runtime" --baseline-kind controlled-artifact \
              --candidate-python "$RUNNER_TEMP/gwflow-compat-candidate/bin/python" \
              --candidate-artifact "$artifact" --candidate-source "$source" \
              --root "build/validation/independent-compatibility/$fixture_profile"
            conda run -p "$RUNNER_TEMP/gwflow-smoke" python tests/compare_runtime.py \
              --baseline-capture "$RUNNER_TEMP/conda-runtime" --baseline-kind controlled-artifact \
              --replacement-capture "$RUNNER_TEMP/compat-replacement" \
              --replacement-reason 'Controlled dependency-loss replacement fixture; not an exact original runtime' \
              --candidate-python "$RUNNER_TEMP/gwflow-compat-candidate/bin/python" \
              --candidate-artifact "$artifact" --candidate-source "$source" \
              --root "build/validation/replacement-compatibility/$fixture_profile"
          done
          python - <<'PYTHON'
          import json
          from pathlib import Path
          import tomllib
          fixtures = {}
          for path in Path("tests/fixtures/packaged_tasks/packages").glob("*/pyproject.toml"):
              project = tomllib.loads(path.read_text())["project"]
              fixtures[project["name"]] = project["version"]
          for profile in ("without-examples", "with-examples"):
              for comparison in ("independent", "replacement"):
                  path = Path(f"build/validation/{comparison}-compatibility/{profile}/comparison.json")
                  evidence = json.loads(path.read_text())
                  assert evidence["status"] == "passed", evidence
                  assert evidence["baseline_kind"] == "controlled-artifact", evidence
                  assert evidence["exact_baseline_runtime"] is (comparison == "independent"), evidence
                  baseline = evidence["environments"]["baseline"]
                  candidate = evidence["environments"]["candidate"]
                  assert baseline["prefix"] == "<BASELINE>" and candidate["prefix"] == "<CANDIDATE>", evidence
                  assert baseline["prefix_identity"] != candidate["prefix_identity"], evidence
                  assert candidate["python_version"] == "3.12.14", candidate
                  if comparison == "independent":
                      assert baseline["python_version"] != candidate["python_version"], (baseline, candidate)
                  else:
                      assert evidence["replacement"]["reason"], evidence
                      assert evidence["baseline_capture"]["artifact"] == evidence["replacement"]["capture"]["artifact"], evidence
                  for environment in (baseline, candidate):
                      assert environment["dependency_policy"] == "independent", environment
                      assert environment["supported_runtime"] is True, environment
                  for name, version in fixtures.items():
                      if profile == "with-examples":
                          assert candidate["versions"][name] == version, candidate
                      else:
                          assert name not in candidate["versions"], candidate
                  assert evidence["journeys"] == {"run": 15, "failures": 0, "errors": 0, "skips": 0}, evidence
                  assert evidence["status_consumer"]["status"] == "passed", evidence
          PYTHON
      - name: Prepare completely qualified release bundle
        id: bundle
        if: steps.simulations.outputs.run == 'true'
        shell: bash -l {0}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          source=$(git rev-parse HEAD)
          python tests/release_artifacts.py prepare \
            --capture "$RUNNER_TEMP/conda-runtime" \
            --qualification build/validation/conda-runtime/restored/gwflow-runtime.json \
            --tag "v$version" --source "$source" --output "$RUNNER_TEMP/qualified-release"
          python tests/release_artifacts.py verify \
            --bundle "$RUNNER_TEMP/qualified-release" --tag "v$version" --source "$source"
      - name: Require selected release-process simulations to pass
        if: always()
        env:
          SIMULATIONS_RUN: ${{ steps.simulations.outputs.run }}
          SIMULATION_RESULTS: >-
            {"selection":{"result":"${{ steps.simulations.outcome }}"},
             "capture":{"result":"${{ steps.capture.outcome }}"},
             "controlled":{"result":"${{ steps.controlled.outcome }}"},
             "bundle":{"result":"${{ steps.bundle.outcome }}"}}
        run: python3 tests/ci_changes.py simulation-gate --run "$SIMULATIONS_RUN" --needs "$SIMULATION_RESULTS"
      - name: Install independent candidate for preserved-release compatibility
        if: steps.compatibility.outputs.mode == 'preserved-release'
        shell: bash -l {0}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          conda create -y -p "$RUNNER_TEMP/gwflow-preserved-candidate" python=3.12.14 "gwflow=$version" -c "file://$RUNNER_TEMP/conda-dist" -c gwforg -c conda-forge
          conda run -p "$RUNNER_TEMP/gwflow-preserved-candidate" python -m pip install --no-deps \
            ./tests/fixtures/packaged_tasks/packages/summary-task ./tests/fixtures/packaged_tasks/packages/report-task
      - name: Compare pinned stable releases in independent runtimes
        if: steps.compatibility.outputs.mode == 'preserved-release'
        shell: bash -l {0}
        run: |
          artifact=$(find "$RUNNER_TEMP/ci-runtime" -name 'gwflow-*.conda' -print -quit)
          test -n "$artifact"
          conda run -p "$RUNNER_TEMP/gwflow-smoke" python tests/select_compatibility.py run \
            --descriptor docs/validation/compatibility/baseline.json \
            --candidate-python "$RUNNER_TEMP/gwflow-preserved-candidate/bin/python" \
            --candidate-artifact "$artifact" --candidate-source "$(git rev-parse HEAD)" \
            --root build/validation/pinned-compatibility
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          overwrite: true
          name: conda-runtime-evidence
          path: |
            build/validation/ci-suite/suite.json
            build/validation/simulation-plan.json
            build/validation/compatibility-plan.json
            build/validation/pinned-compatibility/selection.json
            build/validation/pinned-compatibility/**/comparison.json
            ${{ runner.temp }}/conda-runtime/runtime.explicit.txt
            ${{ runner.temp }}/conda-runtime/runtime.json
            build/validation/conda-runtime/summary.json
            build/validation/independent-compatibility/*/comparison.json
            build/validation/replacement-compatibility/*/comparison.json
            ${{ runner.temp }}/qualified-release/release.json
            ${{ runner.temp }}/qualified-release/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: steps.simulations.outputs.run == 'true' && success()
        with:
          overwrite: true
          name: gwflow-conda-release
          path: ${{ runner.temp }}/qualified-release/*
          retention-days: 90
          if-no-files-found: error
