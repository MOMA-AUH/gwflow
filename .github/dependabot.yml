version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    assignees:
      - micknudsen

  - package-ecosystem: pip
    directories:
      - /
      - /tests/fixtures/packaged_tasks/packages/report-task
      - /tests/fixtures/packaged_tasks/packages/summary-task
    schedule:
      interval: weekly
    assignees:
      - micknudsen

  - package-ecosystem: conda
    directory: /
    schedule:
      interval: weekly
    assignees:
      - micknudsen
