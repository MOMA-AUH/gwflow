name: Restore CI runtime
description: Restore the shared exact Conda build and optionally restore verified shared container fixtures.
inputs:
  containers:
    description: Restore verified fixture images and enable real Apptainer and bioinformatics example tests.
    default: "false"
runs:
  using: composite
  steps:
    - uses: conda-incubator/setup-miniconda@v4
      with:
        miniforge-version: latest
        channels: conda-forge
        conda-remove-defaults: "true"
    - uses: actions/download-artifact@v8
      with:
        name: gwflow-ci-runtime
        path: ${{ runner.temp }}/ci-runtime
    - uses: ./.github/actions/cache-conda-downloads
      with:
        profile: runtime
        manifest: ${{ runner.temp }}/ci-runtime/runtime.explicit.txt
    - name: Restore the exact build runtime and install fixtures
      shell: bash -l {0}
      run: |
        python tests/ci_suite.py install \
          --bundle "$RUNNER_TEMP/ci-runtime" --prefix "$RUNNER_TEMP/gwflow-smoke"
    - uses: ./.github/actions/install-apptainer
      if: inputs.containers == 'true'
    - uses: actions/download-artifact@v8
      if: inputs.containers == 'true'
      with:
        name: gwflow-container-fixtures
        path: ${{ runner.temp }}/container-fixtures
    - name: Verify shared Apptainer fixtures and enable real container tests
      if: inputs.containers == 'true'
      shell: bash
      run: |
        python tests/ci_fixtures.py verify \
          --bundle "$RUNNER_TEMP/container-fixtures" --run-id "$GITHUB_RUN_ID" \
          --github-env "$GITHUB_ENV"
