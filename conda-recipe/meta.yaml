{% set name = "gwflow" %}
{% set version = "0.9.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  path: ..

build:
  noarch: python
  entry_points:
    - gwflow = gwflow.cli:main
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.12,<3.13
    - pip
    - setuptools >=84
  run:
    - python >=3.12,<3.13
    - gwf ==2.1.1
    - rich >=15.0.0,<16
    - textual >=8.2.8,<9

test:
  imports:
    - gwflow
  commands:
    - gwf --version
    - gwflow --version
    - gwflow --help

about:
  summary: Task definitions for gwf workflows
  license: MIT
  license_file: LICENSE
