[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gwflow-report-tasks"
version = "0.1.0"
description = "Net sales task package for the gwflow packaged-transactions example"
requires-python = ">=3.12,<3.13"
dependencies = ["gwflow>=0.1,<0.2"]

[tool.setuptools.packages.find]
where = ["src"]
